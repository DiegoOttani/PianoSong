name: Gerar APK (release)

# Como usar:
#  - Aba "Actions" > "Gerar APK (release)" > "Run workflow": gera um build de teste
#    (pré-release "build-N").
#  - Ou crie uma tag de versão (ex.: git tag v1.0.0 && git push origin v1.0.0):
#    gera a release "v1.0.0".
# O APK fica anexado na página de Releases do repositório.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Configurar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Segredos de assinatura não configurados: o APK sai com chave debug e não poderá ser instalado por cima das próximas versões."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Versão
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            PRE=false
          else
            NAME="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')-build.${{ github.run_number }}"
            TAG="build-${{ github.run_number }}"
            PRE=true
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"

      # O número do build sempre aumenta, para o Android aceitar a atualização.
      - name: Gerar APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Renomear APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "PianoSong-${{ steps.version.outputs.name }}.apk"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PianoSong ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.pre }}
          generate_release_notes: true
          files: PianoSong-*.apk
          body: |
            Para instalar: baixe o arquivo `.apk` abaixo no celular (ou no PC e passe para o celular)
            e abra. Na primeira vez, o Android pede para permitir instalar apps desta fonte.
